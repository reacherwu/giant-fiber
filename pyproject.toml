[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "giantfiber"
version = "0.1.0"
description = "Sub-5ms, Sub-1W Bio-Reflex Coprocessor Core integrating Drosophila Connectome with Jev's System-1 calibrated discrete decision theory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "GiantFiber Team", email = "research@giantfiber.ai" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]
