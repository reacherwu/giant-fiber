[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "giantfiber"
version = "0.2.0"
description = "Event-camera looming-escape reflex built on the Drosophila Giant Fiber circuit (FlyWire/MANC connectome data), with a PX4 offboard bridge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "GiantFiber Team", email = "research@giantfiber.ai" }
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "pymavlink>=2.4.40",
]
sim = [
    "pymavlink>=2.4.40",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyulog>=1.0",
    "pillow>=10",
]

[tool.setuptools]
packages = ["giantfiber", "giantfiber.data", "giantfiber.integrations", "giantfiber.sensors", "giantfiber.sim"]
